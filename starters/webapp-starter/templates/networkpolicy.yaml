{{- if .Values.networkPolicy.enabled -}}
{{- $ing := .Values.networkPolicy.ingress }}
{{- $egr := .Values.networkPolicy.egress }}
{{- if and (not $ing) (not $egr) }}
{{- fail "networkPolicy.enabled requires networkPolicy.ingress and/or networkPolicy.egress (see README for examples)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "<CHARTNAME>.fullname" . }}
  labels:
    {{- include "<CHARTNAME>.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "<CHARTNAME>.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- if $ing }}
    - Ingress
    {{- end }}
    {{- if $egr }}
    - Egress
    {{- end }}
  {{- with $ing }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $egr }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
